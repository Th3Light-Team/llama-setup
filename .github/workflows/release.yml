name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml

  build:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flag: --linux
            artifacts: |
              release/*.AppImage
              release/latest-linux.yml
          - os: windows-latest
            flag: --win
            artifacts: |
              release/*.exe
              release/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Package
        run: npm run dist -- ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: llama-studio-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
